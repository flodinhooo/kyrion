[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyrion-ai"
version = "0.1.0"
description = "Provider-neutral AI service for Kyrion"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.11,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]
# Only needed when the explicit compatibility providers are selected. The
# default Parakeet path uses the provider-neutral HTTP client above.
speech = ["faster-whisper>=1.2,<2.0", "piper-tts>=1.4.2,<2.0"]
cloud-spike = ["google-genai>=1.31,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kyrion_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
