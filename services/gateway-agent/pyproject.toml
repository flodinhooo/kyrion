[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyrion-gateway-agent"
version = "0.1.0"
description = "Least-privilege health and capability agent for Kyrion gateway nodes"
requires-python = ">=3.12"

[project.scripts]
kyrion-gateway-agent = "kyrion_gateway_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kyrion_gateway_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
