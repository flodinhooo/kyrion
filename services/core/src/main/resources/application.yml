server:
  address: ${KYRION_CORE_ADDRESS:127.0.0.1}
  port: 8080

spring:
  config:
    # Local development uses the repository-wide infrastructure/.env.
    # Process/system environment variables still take precedence.
    import: optional:file:../../infrastructure/.env[.properties]
  application:
    name: kyrion-core
  servlet:
    multipart:
      max-file-size: ${KYRION_KNOWLEDGE_MAX_BYTES:10485760}B
      max-request-size: 51MB
  task:
    scheduling:
      pool:
        # A slow calendar provider must not block Home Assistant refresh.
        size: 2
  mvc:
    async:
      request-timeout: 5m
  datasource:
    url: ${KYRION_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/${KYRION_POSTGRES_DB:kyrion}}
    username: ${KYRION_DATABASE_USER:${KYRION_POSTGRES_USER:kyrion}}
    password: ${KYRION_DATABASE_PASSWORD:${KYRION_POSTGRES_PASSWORD:}}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

kyrion:
  knowledge:
    root: ${KYRION_KNOWLEDGE_ROOT:./data/knowledge}
    max-bytes: ${KYRION_KNOWLEDGE_MAX_BYTES:10485760}
    parser-jar: ${KYRION_KNOWLEDGE_PARSER_JAR:build/libs/knowledge-parser.jar}
    embedding-url: ${KYRION_KNOWLEDGE_EMBEDDING_URL:http://127.0.0.1:11434}
    embedding-model: ${KYRION_KNOWLEDGE_EMBEDDING_MODEL:}
    embedding-dimension: ${KYRION_KNOWLEDGE_EMBEDDING_DIMENSION:768}
  security:
    bootstrap-secret-file: ${KYRION_BOOTSTRAP_SECRET_FILE:}
  ai:
    base-url: ${KYRION_AI_BASE_URL:http://127.0.0.1:8000}
    cloud-enabled: ${KYRION_AI_CLOUD_ENABLED:false}
  credentials:
    key-file: ${KYRION_CREDENTIAL_KEY_FILE:E:/Kyrion/Data/secrets/credential.key}
    allow-generation: ${KYRION_ALLOW_KEY_GENERATION:false}
  audit:
    integrity-key-file: ${KYRION_AUDIT_INTEGRITY_KEY_FILE:E:/Kyrion/Data/secrets/audit-integrity.key}
    allow-key-generation: ${KYRION_ALLOW_KEY_GENERATION:false}
  spotify:
    client-id: ${KYRION_SPOTIFY_CLIENT_ID:}
    client-secret: ${KYRION_SPOTIFY_CLIENT_SECRET:}
    redirect-uri: ${KYRION_SPOTIFY_REDIRECT_URI:}
  google:
    client-id: ${KYRION_GOOGLE_CLIENT_ID:}
    client-secret: ${KYRION_GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${KYRION_GOOGLE_REDIRECT_URI:}
