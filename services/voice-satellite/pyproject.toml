[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kyrion-voice-satellite"
version = "0.1.0"
description = "Local wake-word and audio-session runtime for Kyrion voice satellites"
requires-python = ">=3.12"

[project.scripts]
kyrion-voice-satellite = "kyrion_voice_satellite.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4,<9.0", "ruff>=0.12,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kyrion_voice_satellite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
