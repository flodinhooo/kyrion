# V5 keeps the general synthetic baseline and mixes in independent, balanced
# Raspberry Pi room recordings. The generated arrays remain in the private
# E:-backed training workspace and are not committed.

model_name: "hey_velora_v5"
target_phrase:
  - "hey velora"

custom_negative_phrases:
  - "hey valora"
  - "hey velour"
  - "hey flora"
  - "hey melora"
  - "hey veloria"
  - "velora"

n_samples: 20000
n_samples_val: 3000
tts_batch_size: 32
augmentation_batch_size: 16
augmentation_rounds: 2

piper_sample_generator_path: "/training/src/piper-sample-generator-v2.0.0"
output_dir: "/training/output"

rir_paths:
  - "/training/data/rir"
background_paths:
  - "/training/data/background"
background_paths_duplication_rate:
  - 1

false_positive_validation_data_path: "/training/data/validation_set_features.npy"
feature_data_files:
  "ACAV100M_2000h": "/training/data/openwakeword_features_ACAV100M_2000_hrs_16bit.npy"

batch_n_per_class:
  "ACAV100M_2000h": 1024
  "adversarial_negative": 50
  "positive": 50

model_type: "dnn"
layer_size: 32
steps: 50000
max_negative_weight: 1500
target_false_positives_per_hour: 0.2
