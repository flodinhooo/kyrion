name: kyrion-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KYRION_POSTGRES_DB:-kyrion}
      POSTGRES_USER: ${KYRION_POSTGRES_USER:-kyrion}
      POSTGRES_PASSWORD: ${KYRION_POSTGRES_PASSWORD:?Set KYRION_POSTGRES_PASSWORD}
    volumes:
      - /var/lib/kyrion/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - platform
    mem_limit: 1g

  core:
    build:
      context: ../../../services/core
    image: kyrion/core:${KYRION_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KYRION_CORE_ADDRESS: 0.0.0.0
      KYRION_DATABASE_URL: jdbc:postgresql://postgres:5432/${KYRION_POSTGRES_DB:-kyrion}
      KYRION_DATABASE_USER: ${KYRION_POSTGRES_USER:-kyrion}
      KYRION_DATABASE_PASSWORD: ${KYRION_POSTGRES_PASSWORD:?Set KYRION_POSTGRES_PASSWORD}
      KYRION_CREDENTIAL_KEY_FILE: /var/lib/kyrion/secrets/credential.key
      KYRION_AUDIT_INTEGRITY_KEY_FILE: /var/lib/kyrion/secrets/audit-integrity.key
      KYRION_AI_BASE_URL: ${KYRION_AI_BASE_URL:-http://127.0.0.1:8000}
    ports:
      # OTBR already owns loopback port 8080 on kyrion-node.
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/lib/kyrion/secrets:/var/lib/kyrion/secrets
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - platform
    mem_limit: 1536m

  web:
    build:
      context: ../../../apps/web
    image: kyrion/web:${KYRION_VERSION:-local}
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy
    environment:
      CORE_SERVICE_URL: http://core:8080
      AI_SERVICE_URL: ${KYRION_AI_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /app/.next/cache:rw,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - platform
    mem_limit: 768m

  caddy:
    image: kyrion/caddy:2.10.2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - /etc/kyrion/platform/Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/kyrion/platform/tls:/etc/caddy/tls:ro
      - /var/lib/kyrion/caddy/data:/data
      - /var/lib/kyrion/caddy/config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate --quiet --tries=1 --spider https://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - platform
    mem_limit: 256m

networks:
  platform:
    driver: bridge
