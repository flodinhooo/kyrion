# Isolated real-service acceptance. Never points at a personal installation.
name: kyrion-identity-full
services:
  provider-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Supply private acceptance configuration}
      POSTGRES_INITDB_ARGS: --no-sync
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U keycloak]
      interval: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: [start-dev, --import-realm]
    ports: ["127.0.0.1:18089:8080"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://provider-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: acceptance-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Supply private acceptance configuration}
      WEBSITE_CLIENT_SECRET: ${WEBSITE_CLIENT_SECRET:?Supply private acceptance configuration}
      KC_HOSTNAME: http://localhost:18089
    volumes:
      [./acceptance-realm.json:/opt/keycloak/data/import/kyrion-realm.json:ro]
    depends_on:
      provider-db: { condition: service_healthy }
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:18025:8025"]
  website-db:
    image: postgres:17
    ports: ["127.0.0.1:15549:5432"]
    environment:
      POSTGRES_DB: kyrion_website
      POSTGRES_USER: kyrion_website
      POSTGRES_PASSWORD: ${WEBSITE_DB_PASSWORD:?Supply private acceptance configuration}
      POSTGRES_INITDB_ARGS: --no-sync
    volumes:
      - ../../apps/website/account-schema.sql:/docker-entrypoint-initdb.d/001-account.sql:ro
    tmpfs: [/var/lib/postgresql/data]
  core-db:
    image: postgres:17
    ports: ["127.0.0.1:15559:5432"]
    environment:
      POSTGRES_DB: kyrion_acceptance
      POSTGRES_USER: kyrion_acceptance
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Supply private acceptance configuration}
      POSTGRES_INITDB_ARGS: --no-sync
    tmpfs: [/var/lib/postgresql/data]
