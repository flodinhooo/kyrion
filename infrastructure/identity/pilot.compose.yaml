name: kyrion-identity-pilot
services:
  provider-db:
    image: ${IDENTITY_POSTGRES_IMAGE:?Set a reviewed PostgreSQL image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set a private database password}
    volumes:
      - provider-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: ${IDENTITY_KEYCLOAK_IMAGE:?Set a reviewed Keycloak image digest}
    command: ["start", "--import-realm"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:18889:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://provider-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set a private database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDENTITY_ADMIN_USERNAME:?Set an administrator username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Set a private administrator password}
      KC_HOSTNAME: https://auth.kyrion.ch
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_POOL_MAX_THREADS: "32"
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MIN_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      WEBSITE_CLIENT_SECRET: ${WEBSITE_CLIENT_SECRET:?Set a private website client secret}
    volumes:
      - ./pilot-realm.json:/opt/keycloak/data/import/kyrion-realm.json:ro
    networks: [database, provider]
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      provider-db:
        condition: service_healthy
  public-proxy:
    image: ${IDENTITY_PROXY_IMAGE:?Set a reviewed Caddy image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18890:8080"
    volumes:
      - ./pilot.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [provider]
    mem_limit: 128m
    depends_on: [keycloak]
volumes:
  provider-data:
networks:
  database:
    internal: true
  provider:
