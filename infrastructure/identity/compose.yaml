name: kyrion-identity-dev
services:
  provider-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set a private development database password}
    volumes:
      - provider-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://provider-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set a private development database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDENTITY_ADMIN_USERNAME:?Set an administrator username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Set a private administrator password}
      WEBSITE_CLIENT_SECRET: ${WEBSITE_CLIENT_SECRET:?Set a private website client secret}
      KC_HOSTNAME: http://localhost:8089
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./kyrion-realm.json:/opt/keycloak/data/import/kyrion-realm.json:ro
    depends_on:
      provider-db:
        condition: service_healthy
  website-db:
    image: postgres:17
    ports:
      - "127.0.0.1:5549:5432"
    environment:
      POSTGRES_DB: kyrion_website
      POSTGRES_USER: kyrion_website
      POSTGRES_PASSWORD: ${WEBSITE_DB_PASSWORD:?Set a private website database password}
    volumes:
      - website-data:/var/lib/postgresql/data
      - ../../apps/website/account-schema.sql:/docker-entrypoint-initdb.d/001-account.sql:ro
volumes:
  provider-data:
  website-data:
