services:
  postgres:
    image: postgres:17-alpine
    container_name: kyrion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KYRION_POSTGRES_DB:-kyrion}
      POSTGRES_USER: ${KYRION_POSTGRES_USER:-kyrion}
      POSTGRES_PASSWORD: ${KYRION_POSTGRES_PASSWORD:?Set KYRION_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - type: bind
        source: ${KYRION_POSTGRES_DATA_PATH:-E:/Kyrion/Data/postgres}
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
