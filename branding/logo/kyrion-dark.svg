<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 3900 900"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Kyrion Dark Logo</title>
  <desc id="desc">
    Kyrion K-Core symbol with custom geometric KYRION wordmark.
    Dark theme variant.
  </desc>

  <defs>

    <!-- =====================================================
         CORE COLORS
         ===================================================== -->

    <linearGradient
      id="core-ring"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#8B4DFF" />
      <stop offset="45%" stop-color="#6C43F5" />
      <stop offset="100%" stop-color="#168BFF" />
    </linearGradient>

    <radialGradient
      id="core-fill"
      cx="40%"
      cy="35%"
      r="70%"
    >
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="38%" stop-color="#E5FAFF" />
      <stop offset="72%" stop-color="#8CDEFF" />
      <stop offset="100%" stop-color="#53BFFF" />
    </radialGradient>

    <filter
      id="core-glow"
      x="-150%"
      y="-150%"
      width="400%"
      height="400%"
    >
      <feGaussianBlur stdDeviation="16" />
    </filter>

  </defs>


  <!-- =====================================================
       K-CORE MARK
       ===================================================== -->

  <g
    id="k-core-mark"
    transform="translate(60 60) scale(.72)"
    fill="#F7F8FA"
  >

    <!-- Upper-left module -->
    <path d="
      M120 100
      L120 416.5
      L177.6 474.1
      L264.1 502.9
      L264.1 474.1
      L206.5 451.1
      L148.8 393.5
      L148.8 146
      L160.4 134.5
      L292.9 140.3
      L292.9 318.7
      L350.6 382
      L362.1 376.3
      L362.1 347.5
      L327.5 312.9
      L327.5 100
      Z
    "/>

    <!-- Upper-right module -->
    <path d="
      M904 100
      L644.6 100
      L431.3 341.7
      L460.1 353.2
      L661.9 134.5
      L811.8 134.5
      L817.5 146
      L563.9 428.1
      L494.7 456.8
      L500.5 474.1
      L581.2 456.8
      Z
    "/>

    <!-- Lower-left module -->
    <path d="
      M166.1 525.9
      L120 577.7
      L120 900
      L327.5 900
      L327.5 675.5
      L362.1 635.3
      L362.1 612.2
      L344.8 606.5
      L292.9 664
      L292.9 859.7
      L281.4 871.2
      L166.1 871.2
      L148.8 859.7
      L148.8 595
      L212.2 537.4
      Z
    "/>

    <!-- Lower-right module -->
    <path d="
      M500.5 508.6
      L500.5 531.7
      L558.1 548.9
      L829.1 859.7
      L823.3 871.2
      L667.6 871.2
      L460.1 635.3
      L437.1 658.3
      L644.6 900
      L904 900
      L586.9 525.9
      Z
    "/>

  </g>


  <!-- =====================================================
       K-CORE CENTER
       ===================================================== -->

  <g
    id="k-core-center"
    transform="translate(60 60) scale(.72)"
  >

    <!-- ambient glow -->
    <circle
      cx="379.4"
      cy="502.9"
      r="92"
      fill="#684BFF"
      opacity=".28"
      filter="url(#core-glow)"
    />

    <!-- purple / blue ring -->
    <circle
      cx="379.4"
      cy="502.9"
      r="78"
      fill="url(#core-ring)"
    />

    <!-- light separator -->
    <circle
      cx="379.4"
      cy="502.9"
      r="53"
      fill="#EEF8FF"
    />

    <!-- luminous core -->
    <circle
      cx="379.4"
      cy="502.9"
      r="42"
      fill="url(#core-fill)"
    />

    <!-- optical highlight -->
    <ellipse
      cx="363"
      cy="486"
      rx="21"
      ry="13"
      fill="#FFFFFF"
      opacity=".28"
    />

  </g>


  <!-- =====================================================
       DIVIDER
       ===================================================== -->

  <rect
    id="divider"
    x="825"
    y="205"
    width="3"
    height="490"
    rx="1.5"
    fill="#F7F8FA"
    opacity=".32"
  />


  <!-- =====================================================
       KYRION CUSTOM WORDMARK
       ===================================================== -->

  <g
    id="kyrion-wordmark"
    transform="translate(900 215) scale(4.7)"
    fill="#F7F8FA"
  >


    <!-- ===================================================
         K
         =================================================== -->

    <!-- K stem -->
    <path
      id="wordmark-k-stem"
      d="
        M26 24
        H37
        V90
        H26
        Z
      "
    />

    <!-- K diagonal structure -->
    <path
      id="wordmark-k-arms"
      d="
        M73 24

        L41 60
        L51 61

        L76 90
        H90

        L59 55

        L87 24
        Z
      "
    />


    <!-- ===================================================
         Y
         =================================================== -->

    <path
      id="wordmark-y"
      d="
        M135 24

        L165 61
        V89

        L175 90
        V62

        L206 24
        H193

        L171 51
        L165 46
        L148 24

        Z
      "
    />


    <!-- ===================================================
         R
         =================================================== -->

    <path
      id="wordmark-r"
      d="
        M256 24
        V89

        L266 90
        V35

        L268 33
        H298

        L306 40
        V48

        L300 54
        L279 55

        L305 90
        H317

        L299 65
        L301 63
        H305

        L316 52
        V37

        L305 24

        Z
      "
    />


    <!-- ===================================================
         I
         =================================================== -->

    <path
      id="wordmark-i"
      d="
        M370 24
        H380
        L379 90
        H370
        Z
      "
    />


    <!-- ===================================================
         O
         =================================================== -->

    <path
      id="wordmark-o"
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="
        M444 25

        L433 37
        V77

        L446 90
        H484

        L498 76
        L497 36

        L485 24
        Z


        M450 34

        L443 41
        L442 71

        L451 80
        H479

        L488 71
        V42

        L479 33
        Z
      "
    />


    <!-- ===================================================
         N
         =================================================== -->

    <path
      id="wordmark-n"
      d="
        M552 24

        V90
        H562

        L563 39
        L566 41
        L605 90

        H619
        V24
        H609

        L608 75
        L605 73
        L566 24

        Z
      "
    />

  </g>

</svg>
