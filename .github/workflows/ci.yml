name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and boot JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build migration rehearsal artifact
        working-directory: services/core
        run: ./gradlew bootJar --no-daemon --console=plain
      - name: Run complete Core tests
        working-directory: services/core
        env:
          KYRION_MIGRATION_REHEARSAL_JAR: ${{ github.workspace }}/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar
          KYRION_MIGRATION_PYTHON: python
        # Testcontainers supplies disposable PostgreSQL; never use an installed DB.
        run: ./gradlew test --no-daemon --console=plain

  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: TypeScript
        working-directory: apps/web
        run: pnpm typecheck
      - name: Tests
        working-directory: apps/web
        run: pnpm test
      - name: Production build
        working-directory: apps/web
        run: pnpm build

  installer:
    name: Installer validation
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Installer runtime primitives
        run: python -m pip install -r infrastructure/installer-v1/runtime-requirements.txt
      - name: Python tests and syntax
        run: |
          python -m unittest discover -s infrastructure/installer-v1/tests -v
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('infrastructure/installer-v1').glob('*.py')]"
      - name: Shell syntax
        if: runner.os == 'Linux'
        run: |
          for script in infrastructure/installer-v1/*.sh infrastructure/installer-v1/release/*.sh infrastructure/nodes/kyrion-node/*.sh; do
            sh -n "$script"
          done
      - name: Signature chain
        if: runner.os == 'Linux'
        run: sh infrastructure/installer-v1/release/test-signature.sh
      - name: Actual encrypted PostgreSQL restore in disposable targets
        if: runner.os == 'Linux'
        run: |
          docker pull postgres:17.6-alpine
          fixture_image=$(docker image inspect postgres:17.6-alpine --format '{{.Id}}')
          python infrastructure/installer-v1/tests/integration/verify-recovery.py --postgres-image "$fixture_image"
      - name: Compose contract
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/kyrion-data" "$RUNNER_TEMP/kyrion-secrets"
          cp infrastructure/installer-v1/templates/compose.yml "$RUNNER_TEMP/compose.yml"
          printf 'KYRION_RELEASE=ci-test\nKYRION_HOSTNAME=kyrion.test\nKYRION_BIND_ADDRESS=192.168.50.10\nKYRION_DATA_DIR=%s\nKYRION_SECRETS_DIR=%s\n' "$RUNNER_TEMP/kyrion-data" "$RUNNER_TEMP/kyrion-secrets" > "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" -f "$RUNNER_TEMP/compose.yml" config --quiet

  installer-fresh-stack:
    name: Isolated fresh stack and offline restart
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.1'
      - name: Prepare existing Chromium test tooling
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile
          pnpm --filter website exec playwright install --with-deps chromium
      - run: docker build -t kyrion-installer-core-test:ci services/core
      - run: docker build -t kyrion-installer-web-test:ci apps/web
      - run: docker build -t kyrion-installer-helper-test:ci infrastructure/installer-v1/tests/integration
      - name: Execute real local setup without AI, hardware or external connectivity
        run: |
          docker pull postgres:17.6-alpine
          docker pull caddy:2.10.2-alpine
          core_image=$(docker image inspect kyrion-installer-core-test:ci --format '{{.Id}}')
          web_image=$(docker image inspect kyrion-installer-web-test:ci --format '{{.Id}}')
          helper_image=$(docker image inspect kyrion-installer-helper-test:ci --format '{{.Id}}')
          postgres_image=$(docker image inspect postgres:17.6-alpine --format '{{.Id}}')
          caddy_image=$(docker image inspect caddy:2.10.2-alpine --format '{{.Id}}')
          python infrastructure/installer-v1/tests/integration/verify-fresh-stack.py --core-image "$core_image" --web-image "$web_image" --helper-image "$helper_image" --postgres-image "$postgres_image" --caddy-image "$caddy_image"
          python infrastructure/installer-v1/tests/integration/verify-fresh-stack.py --browser-checks --core-image "$core_image" --web-image "$web_image" --helper-image "$helper_image" --postgres-image "$postgres_image" --caddy-image "$caddy_image"

  installer-native:
    name: Native installer / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025, ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
      - name: Build and execute native installer probe
        run: python infrastructure/installer-v1/release/build-native.py --version 0.0.0-ci --output build/native-installer
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: build/native-installer
          if-no-files-found: error

  python:
    name: Python / ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [ai, gateway-agent, voice-satellite]
    defaults:
      run:
        working-directory: services/${{ matrix.component }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # These projects have no lockfile. Install declared dev extras only;
      # speech/model/cloud extras and hardware runtimes are deliberately excluded.
      - run: python -m pip install '.[dev]' build
      - run: python -m ruff check .
      - run: python -m pytest
      - run: python -m build

  website:
    name: Public website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KYRION_WEBSITE_ACCOUNT_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.29.3 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website lint
      - run: pnpm --filter website format:check
      - run: pnpm --filter website typecheck
      - run: pnpm --filter website build
      - run: pnpm --filter website exec playwright install --with-deps chromium
      # Synthetic browser/server tests only. Real OIDC/hardware acceptance is separate.
      - run: pnpm --filter website test
