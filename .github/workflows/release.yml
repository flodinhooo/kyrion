name: Release bundle

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Immutable test version, for example 0.0.0-test.1
        required: true
        type: string
      publish:
        description: Must remain false until the release environment is approved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64, amd64 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then version="$INPUT_VERSION"; fi
          [[ "$version" != *latest* && "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build unsigned platform bundle
        run: sh infrastructure/installer-v1/release/build-bundle.sh "${{ steps.version.outputs.version }}" "$RUNNER_TEMP/bundle" "linux/${{ matrix.arch }}"
      - name: Validate unsigned bundle
        run: python3 infrastructure/installer-v1/bundle.py "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/bundle/manifest.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: unsigned-bundle-${{ matrix.arch }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
  sign:
    strategy:
      matrix:
        arch: [ arm64, amd64 ]
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-bundle-${{ matrix.arch }}
          path: bundle
      - name: Sign and verify manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.KYRION_RELEASE_SIGNING_KEY_PEM }}
          RELEASE_PUBLIC_KEY: ${{ secrets.KYRION_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          test -n "$RELEASE_SIGNING_KEY"; test -n "$RELEASE_PUBLIC_KEY"
          umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/signing.pem"; printf '%s\n' "$RELEASE_PUBLIC_KEY" > "$RUNNER_TEMP/public.pem"
          sh infrastructure/installer-v1/release/sign-manifest.sh bundle/manifest.json "$RUNNER_TEMP/signing.pem" bundle/manifest.sig
          sh infrastructure/installer-v1/release/verify-manifest.sh bundle/manifest.json bundle/manifest.sig "$RUNNER_TEMP/public.pem"
          rm -f "$RUNNER_TEMP/signing.pem"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: signed-bundle-${{ matrix.arch }}
          path: bundle
          if-no-files-found: error

  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025, ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
      - name: Build native artifact and execute smoke check
        env:
          INSTALLER_VERSION: ${{ needs.build.outputs.version }}
        run: python -c "import os,runpy,sys; sys.argv=['build-native.py','--version',os.environ['INSTALLER_VERSION'],'--output','build/native-installer']; runpy.run_path('infrastructure/installer-v1/release/build-native.py',run_name='__main__')"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: build/native-installer
          if-no-files-found: error

  publish:
    timeout-minutes: 5
    needs: sign
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - run: echo 'Publishing is intentionally disabled until release gates are approved.' && exit 1
