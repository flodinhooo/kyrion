name: Disposable Windows installer service acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-services:
    runs-on: windows-2025
    timeout-minutes: 75
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      KYRION_AI_CLOUD_ENABLED: 'false'
      KYRION_CENTRAL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Install frozen build dependencies
        run: python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
      - name: Build actual Core and isolated parser
        working-directory: services/core
        run: .\gradlew.bat bootJar knowledgeParserJar --no-daemon --console=plain
      - name: Build standalone Web without repository/private environment
        working-directory: apps/web
        env:
          NODE_OPTIONS: ''
          CORE_SERVICE_URL: http://127.0.0.1:9
          KYRION_PUBLIC_URL: https://fixture.test
        run: |
          corepack enable
          corepack prepare pnpm@10.29.3 --activate
          pnpm install --frozen-lockfile --config.node-linker=hoisted
          pnpm build
      - name: Build both native installer and direct-process SCM host
        shell: pwsh
        run: |
          $version = "0.0.0-ci.$env:GITHUB_RUN_ID.$env:GITHUB_RUN_ATTEMPT"
          "KYRION_CI_VERSION=$version" >> $env:GITHUB_ENV
          python infrastructure/installer-v1/release/build-native.py --version $version --output build/native-service-installer
          python infrastructure/installer-v1/release/build-native-service-host.py --output build/native-service-host
      - name: Prepare public pinned native runtime bundle
        shell: pwsh
        run: |
          $coreJar = Get-Item services/core/build/libs/kyrion-core-*-SNAPSHOT.jar
          if (@($coreJar).Count -ne 1) { throw 'E_CI_CORE_ARTIFACT' }
          python infrastructure/installer-v1/release/assemble-windows-profile.py --fetch --archives build/windows-vendors --core-jar $coreJar.FullName --parser-jar services/core/build/libs/knowledge-parser.jar --web-build apps/web --service-host build/native-service-host --output build/windows-ci-profile --version $env:KYRION_CI_VERSION --schema 48
          python infrastructure/installer-v1/release/build-windows-bundle.py --profile build/windows-ci-profile --metadata build/windows-ci-profile-metadata.json --output build/windows-ci-bundle
          python infrastructure/installer-v1/release/sign-development-bundle.py build/windows-ci-bundle
      - name: Run actual service installation, permissions, repeat and restart
        shell: pwsh
        run: |
          $worker = Get-Item "build/native-service-installer/kyrion-installer-$env:KYRION_CI_VERSION-windows-amd64.exe"
          & $worker.FullName --verify-bundle --bundle build/windows-ci-bundle --public-key build/windows-ci-bundle/test-public.pem
          if ($LASTEXITCODE -ne 0) { throw 'E_CI_BUNDLE_VERIFICATION' }
          python infrastructure/installer-v1/tests/integration/verify-windows-services.py --bundle build/windows-ci-bundle --key build/windows-ci-bundle/test-public.pem --worker $worker.FullName --report build/windows-services-report.json
      - name: Keep public developer evidence only
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: windows-services-evidence
          path: |
            build/windows-services-report.json
            build/native-service-installer/*.json
          if-no-files-found: warn
