name: Isolated Compose update transaction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual application JARs and fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          chmod +x services/core/gradlew
          services/core/gradlew -p services/core bootJar --no-daemon --console=plain
          python -m venv build/compose-python
          build/compose-python/bin/python -m pip install -r infrastructure/installer-v1/runtime-requirements.txt
      - name: Build scoped real Core and Web images
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(build/compose-python/bin/python infrastructure/installer-v1/tests/integration/prepare-compose-fixture.py \
            --docker "$(command -v docker)" --repository "$PWD" --work "$PWD/build" \
            --core-jar "$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar" \
            --parser-jar "$PWD/services/core/build/libs/knowledge-parser.jar")"
          printf 'directory=%s\n' "$(dirname "$manifest")" >> "$GITHUB_OUTPUT"
      - name: Exercise encrypted backup, migration, interrupted activation and recovery
        env:
          FIXTURE_DIRECTORY: ${{ steps.fixture.outputs.directory }}
        shell: bash
        run: |
          set -euo pipefail
          build/compose-python/bin/python infrastructure/installer-v1/tests/integration/run-compose-fixture.py \
            --docker "$(command -v docker)" --fixture "$FIXTURE_DIRECTORY"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        if: always()
        with:
          name: isolated-compose-transaction-evidence
          path: |
            build/compose-fixture-*/fixture.json
            build/compose-fixture-*/*-build.log
            build/compose-fixture-*/runs/*/report.json
            build/compose-fixture-*/runs/*/transaction-run.log
            build/compose-fixture-*/runs/*/worker-build.log
          if-no-files-found: warn
