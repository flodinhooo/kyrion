name: Isolated Linux installer Core acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual Core and prepare test-only dependencies
        shell: bash
        run: |
          chmod +x services/core/gradlew
          services/core/gradlew -p services/core bootJar --no-daemon --console=plain
          python -m venv build/acceptance-python
          build/acceptance-python/bin/python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
          # Official PGDG repository, scoped key and reviewed key-file digest.
          # https://www.postgresql.org/download/linux/ubuntu/
          mkdir -p build
          curl --fail --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o build/pgdg.asc
          python -c "import hashlib; assert hashlib.sha256(open('build/pgdg.asc','rb').read()).hexdigest() == '0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76'"
          sudo install -m 644 build/pgdg.asc /usr/share/keyrings/kyrion-pgdg.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/kyrion-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/kyrion-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17 iproute2 gnupg
      - name: Build finite native worker and validate actual systemd definitions without registration
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          build/acceptance-python/bin/python infrastructure/installer-v1/release/build-native.py --version "$version" --output build/native-linux-worker > build/native-linux-worker-build.log 2>&1
          mkdir build/native-linux-worker-unpacked
          tar -xzf "build/native-linux-worker/kyrion-installer-${version}-linux-amd64.tar.gz" -C build/native-linux-worker-unpacked kyrion-installer
          build/acceptance-python/bin/python infrastructure/installer-v1/tests/integration/verify-update-units.py --worker "$PWD/build/native-linux-worker-unpacked/kyrion-installer" --work "$PWD/build" --report build/linux-update-unit-report.json
      - name: Run synthetic accounts and HA only in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-core-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-linux-core.py" \
              --core-jar "$4" --core-sha256 "$5" \
              --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work-parent "$3/build/isolated-core-work" \
              --report "$3/build/isolated-core-report.json"
          ' kyrion-isolated "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - name: Restore actual Core accounts and data with interruption in an isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-restore-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-application-restore.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-restore-work" \
              --report "$3/build/isolated-restore-report.json"
          ' kyrion-restore "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - name: Exercise real Flyway update, interrupted activation and database recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-update-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-update-transaction.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-update-work" \
              --report "$3/build/isolated-update-report.json"
          ' kyrion-update "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: isolated-linux-core-evidence
          path: |
            build/isolated-core-report.json
            build/isolated-restore-report.json
            build/isolated-update-report.json
            build/linux-update-unit-report.json
          if-no-files-found: error
