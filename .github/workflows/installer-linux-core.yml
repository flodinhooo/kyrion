name: Isolated Linux installer Core acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-agent-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual application images and retain test-only vendor runtimes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python -m venv build/ingress-python
          build/ingress-python/bin/python -m pip install -r infrastructure/installer-v1/runtime-requirements.txt
          docker build --iidfile build/ingress-core.id services/core
          docker build --iidfile build/ingress-web.id apps/web
          docker pull postgres:17.6
          docker pull caddy:2.10.2-alpine
          docker image inspect --format '{{.Id}}' postgres:17.6 > build/ingress-postgres.id
          docker image inspect --format '{{.Id}}' caddy:2.10.2-alpine > build/ingress-caddy.id
          container="kyrion-ingress-jar-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker create --name "$container" "$(cat build/ingress-core.id)" >/dev/null
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/opt/kyrion/app.jar" build/ingress-core.jar
          build/ingress-python/bin/python - <<'PY'
          import hashlib, json
          from pathlib import Path
          images = {name: Path(f'build/ingress-{name}.id').read_text().strip() for name in ('core', 'web', 'postgres', 'caddy')}
          with Path('build/ingress-core.jar').open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          Path('build/ingress-image-plan.json').write_text(json.dumps({'scope': 'installer-agent-ingress-development-images', 'images': images, 'coreJarSha256': digest}), encoding='utf-8')
          PY
          docker image save --output build/ingress-images.tar "$(cat build/ingress-core.id)" "$(cat build/ingress-web.id)" "$(cat build/ingress-postgres.id)" "$(cat build/ingress-caddy.id)"
      - name: Test the actual Compose transaction inside a private Docker and containerd runtime
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          work="/var/lib/kyrion-ingress-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir -m 700 "$work"
          sudo "$PWD/build/ingress-python/bin/python" infrastructure/installer-v1/tests/integration/run-ingress-private-daemon.py \
            --work "$work" --images "$PWD/build/ingress-images.tar" \
            --images-sha256 "$(sha256sum build/ingress-images.tar | cut -d ' ' -f 1)" \
            --image-plan "$PWD/build/ingress-image-plan.json" --daemon "$(command -v dockerd)" \
            --report "$work/report.json"
          sudo install -m 644 "$work/report.json" build/isolated-ingress-report.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: isolated-linux-agent-ingress-evidence
          path: build/isolated-ingress-report.json
          if-no-files-found: error
  isolated-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual Core and prepare test-only dependencies
        shell: bash
        run: |
          chmod +x services/core/gradlew
          services/core/gradlew -p services/core bootJar --no-daemon --console=plain
          python -m venv build/acceptance-python
          build/acceptance-python/bin/python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
          # Official PGDG repository, scoped key and reviewed key-file digest.
          # https://www.postgresql.org/download/linux/ubuntu/
          mkdir -p build
          curl --fail --proto '=https' --tlsv1.2 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o build/pgdg.asc
          python -c "import hashlib; assert hashlib.sha256(open('build/pgdg.asc','rb').read()).hexdigest() == '0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76'"
          sudo install -m 644 build/pgdg.asc /usr/share/keyrings/kyrion-pgdg.asc
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/kyrion-pgdg.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/kyrion-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-17 iproute2 gnupg
      - name: Build finite native worker and validate actual systemd definitions without registration
        shell: bash
        run: |
          set -euo pipefail
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          build/acceptance-python/bin/python infrastructure/installer-v1/release/build-native.py --version "$version" --output build/native-linux-worker > build/native-linux-worker-build.log 2>&1
          mkdir build/native-linux-worker-unpacked
          tar -xzf "build/native-linux-worker/kyrion-installer-${version}-linux-amd64.tar.gz" -C build/native-linux-worker-unpacked kyrion-installer
          build/acceptance-python/bin/python infrastructure/installer-v1/tests/integration/verify-update-units.py --worker "$PWD/build/native-linux-worker-unpacked/kyrion-installer" --work "$PWD/build" --report build/linux-update-unit-report.json
      - name: Execute the frozen startup fence under real systemd on the disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(ps -p 1 -o comm= | xargs)" = systemd
          sudo systemctl is-active docker.service
          test ! -e /work/kyrion-systemd-fixture.json
          sudo install -d -m 700 /work
          printf '%s\n' '{"scope":"installer-systemd-development-fixture","name":"disposable-hosted-ci"}' | sudo tee /work/kyrion-systemd-fixture.json >/dev/null
          sudo chmod 600 /work/kyrion-systemd-fixture.json
          sudo "$PWD/build/acceptance-python/bin/python" infrastructure/installer-v1/tests/integration/verify-linux-startup.py \
            --worker "$PWD/build/native-linux-worker-unpacked/kyrion-installer" \
            --report "$PWD/build/linux-startup-service-report.json"
          sudo "$PWD/build/acceptance-python/bin/python" infrastructure/installer-v1/tests/integration/verify-backup-timer.py \
            --worker "$PWD/build/native-linux-worker-unpacked/kyrion-installer" \
            --report "$PWD/build/linux-backup-timer-report.json"
      - name: Install missing GnuPG and resume its acknowledgement in a disposable Debian chroot
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo "$PWD/build/acceptance-python/bin/python" infrastructure/installer-v1/tests/integration/prepare-linux-crypto-root.py > build/linux-crypto-install-report.json
      - name: Install packaged Docker CLI and Compose in a disposable Debian chroot
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo "$PWD/build/acceptance-python/bin/python" infrastructure/installer-v1/tests/integration/prepare-linux-crypto-root.py --kind runtime > build/linux-runtime-packages-report.json
      - name: Verify public HTTPS in a disposable Debian root without system CAs
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo "$PWD/build/acceptance-python/bin/python" infrastructure/installer-v1/tests/integration/prepare-linux-crypto-root.py --kind transport --worker "$PWD/build/native-linux-worker-unpacked/kyrion-installer" > build/linux-public-https-report.json
      - name: Run synthetic accounts and HA only in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-core-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-linux-core.py" \
              --core-jar "$4" --core-sha256 "$5" \
              --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work-parent "$3/build/isolated-core-work" \
              --report "$3/build/isolated-core-report.json"
          ' kyrion-isolated "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - name: Restore actual Core accounts and data with interruption in an isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-restore-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-application-restore.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-restore-work" \
              --report "$3/build/isolated-restore-report.json"
          ' kyrion-restore "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - name: Resume prepared agent enrollment after a real committed but lost response
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-agent-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-agent-enrollment.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --gateway-source "$3/services/gateway-agent/src" \
              --work "$3/build/isolated-agent-work" \
              --report "$3/build/isolated-agent-report.json"
          ' kyrion-agent "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - name: Pair and report real node health through the frozen installer without target Python
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-frozen-node-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          worker="$PWD/build/native-linux-worker-unpacked/kyrion-installer"
          worker_digest="$(sha256sum "$worker" | cut -d ' ' -f 1)"
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-installer-node.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --installer "$7" --installer-sha256 "$8" --installer-version "$9" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-frozen-node-work" \
              --report "$3/build/isolated-frozen-node-report.json"
          ' kyrion-frozen-node "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java" "$worker" "$worker_digest" "$version"
      - name: Export and import pairing through actual configured local TLS ingress
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          docker pull caddy:2.10.2-alpine
          image="$(docker image inspect caddy:2.10.2-alpine --format '{{.Id}}')"
          container="$(docker create --network none --label io.kyrion.fixture=installer-pairing "$image" caddy version)"
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/bin/caddy" build/pairing-fixture-caddy
          chmod 755 build/pairing-fixture-caddy
          cp /etc/hosts build/isolated-pairing-hosts
          printf '\n10.231.0.1 fixture.test\n' >> build/isolated-pairing-hosts
          mkdir build/isolated-pairing-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          worker="$PWD/build/native-linux-worker-unpacked/kyrion-installer"
          version="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          sudo unshare --mount --net --propagation private /bin/bash -c '
            set -euo pipefail
            mount --bind "$3/build/isolated-pairing-hosts" /etc/hosts
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            sysctl -q -w net.ipv4.ip_unprivileged_port_start=0
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-pairing-transfer.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --installer "$7" --installer-sha256 "$8" --installer-version "${11}" \
              --caddy "$9" --caddy-sha256 "${10}" --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-pairing-work" --report "$3/build/isolated-pairing-report.json"
          ' kyrion-pairing "$(id -u)" "$(id -g)" "$PWD" "$jar" "$(sha256sum "$jar" | cut -d ' ' -f 1)" "$JAVA_HOME/bin/java" "$worker" "$(sha256sum "$worker" | cut -d ' ' -f 1)" "$PWD/build/pairing-fixture-caddy" "$(sha256sum build/pairing-fixture-caddy | cut -d ' ' -f 1)" "$version"
      - name: Exercise prepared-node system service with a real dedicated non-root account
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          work="/var/lib/kyrion-node-service-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sudo mkdir -m 755 "$work"
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          worker="$PWD/build/native-linux-worker-unpacked/kyrion-installer"
          sudo "$PWD/build/acceptance-python/bin/python" \
            "$PWD/infrastructure/installer-v1/tests/integration/verify-node-service.py" \
            --installer "$worker" --installer-sha256 "$(sha256sum "$worker" | cut -d ' ' -f 1)" \
            --core-jar "$jar" --core-sha256 "$(sha256sum "$jar" | cut -d ' ' -f 1)" \
            --java "$JAVA_HOME/bin/java" --postgres-bin /usr/lib/postgresql/17/bin \
            --fixture-user "$(id -un)" --work "$work" \
            --report "$PWD/build/linux-node-service-report.json"
      - name: Exercise real Flyway update, interrupted activation and database recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-update-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-update-transaction.py" \
              --core-jar "$4" --core-sha256 "$5" --java "$6" \
              --postgres-bin /usr/lib/postgresql/17/bin \
              --work "$3/build/isolated-update-work" \
              --report "$3/build/isolated-update-report.json"
          ' kyrion-update "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: isolated-linux-core-evidence
          path: |
            build/isolated-core-report.json
            build/isolated-restore-report.json
            build/isolated-update-report.json
            build/isolated-agent-report.json
            build/isolated-frozen-node-report.json
            build/linux-node-service-report.json
            build/isolated-pairing-report.json
            build/linux-update-unit-report.json
            build/linux-startup-service-report.json
            build/linux-backup-timer-report.json
            build/linux-crypto-install-report.json
            build/linux-runtime-packages-report.json
            build/linux-public-https-report.json
          if-no-files-found: error
