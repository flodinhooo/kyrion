name: Isolated Linux installer Core acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build actual Core and prepare test-only dependencies
        shell: bash
        run: |
          chmod +x services/core/gradlew
          services/core/gradlew -p services/core bootJar --no-daemon --console=plain
          python -m venv build/acceptance-python
          build/acceptance-python/bin/python -m pip install -r infrastructure/installer-v1/release/native-build-requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 iproute2
      - name: Run synthetic accounts and HA only in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/isolated-core-work
          jar="$PWD/services/core/build/libs/kyrion-core-0.1.0-SNAPSHOT.jar"
          digest="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          sudo unshare --net /bin/bash -c '
            set -euo pipefail
            ip link set lo up
            ip addr add 10.231.0.1/32 dev lo
            exec setpriv --reuid "$1" --regid "$2" --init-groups \
              "$3/build/acceptance-python/bin/python" \
              "$3/infrastructure/installer-v1/tests/integration/verify-linux-core.py" \
              --core-jar "$4" --core-sha256 "$5" \
              --java "$6" \
              --postgres-bin /usr/lib/postgresql/16/bin \
              --work-parent "$3/build/isolated-core-work" \
              --report "$3/build/isolated-core-report.json"
          ' kyrion-isolated "$(id -u)" "$(id -g)" "$PWD" "$jar" "$digest" "$JAVA_HOME/bin/java"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: isolated-linux-core-evidence
          path: build/isolated-core-report.json
          if-no-files-found: error
